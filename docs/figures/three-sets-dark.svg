<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 284" width="720" height="284" role="img" aria-label="Train, holdout and eval as three sets: select writes train, the paired before and after runs on holdout, evaluate rows stay out of training, and decontaminate checks the overlap">
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9CA3AF"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5CB08A"/></marker></defs>
<rect width="720" height="284" rx="6" fill="#0B1220"/>
<rect x="16" y="40" width="208" height="72" rx="6" fill="#12261D" stroke="#5CB08A"/>
<text x="120.0" y="65.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#E5E7EB" text-anchor="middle">train</text>
<text x="120.0" y="81.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9CA3AF" text-anchor="middle">purpose="train"</text>
<text x="120.0" y="95.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9CA3AF" text-anchor="middle">select(mode="rl").export()</text>
<rect x="256" y="40" width="208" height="72" rx="6" fill="#121A2B" stroke="#334155"/>
<text x="360.0" y="65.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#E5E7EB" text-anchor="middle">holdout</text>
<text x="360.0" y="81.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9CA3AF" text-anchor="middle">purpose="holdout"</text>
<text x="360.0" y="95.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9CA3AF" text-anchor="middle">delta_report(before, after)</text>
<rect x="496" y="40" width="208" height="72" rx="6" fill="#121A2B" stroke="#334155"/>
<text x="600.0" y="65.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#E5E7EB" text-anchor="middle">eval</text>
<text x="600.0" y="81.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9CA3AF" text-anchor="middle">purpose="eval"</text>
<text x="600.0" y="95.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9CA3AF" text-anchor="middle">lineage.source == "eval"</text>
<path d="M 120.0 112 L 120.0 150 L 360.0 150 L 360.0 116" fill="none" stroke="#5CB08A" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<path d="M 120.0 150 L 600.0 150 L 600.0 116" fill="none" stroke="#5CB08A" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="136.0" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#5CB08A" text-anchor="start">decontaminate(train, against=[holdout, eval])</text>
<text x="16" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="400" fill="#CBD5E1" text-anchor="start">drops a train row that shares a task id or the same normalised text with either set,</text>
<text x="16" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="400" fill="#CBD5E1" text-anchor="start">80 percent of its 8-grams, or cosine at or above 0.85 with an embedder=</text>
<text x="16" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="400" fill="#9CA3AF" text-anchor="start">eval_sourced: every selector warns before an evaluate() row reaches a training file</text>
<text x="16" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="400" fill="#9CA3AF" text-anchor="start">the number that counts is measured on holdout: tasks the model never trained on</text>
</svg>
