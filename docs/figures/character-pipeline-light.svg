<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-label="Character training as a data pipeline: constitution, prompts, replies under the deployment prompt, a judge that alone sees the principle, pairs and SFT, then a paired delta">
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6B7280"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3F8F6B"/></marker></defs>
<rect width="960" height="250" rx="6" fill="#FFFFFF"/>
<rect x="16" y="40" width="168" height="54" rx="6" fill="#F4F6F9" stroke="#D1D5DB"/>
<text x="100.0" y="62.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#0B1220" text-anchor="middle">constitution</text>
<text x="100.0" y="79.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="middle">one principle per trait</text>
<line x1="184" y1="67.0" x2="204" y2="67.0" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="204" y="40" width="168" height="54" rx="6" fill="#F4F6F9" stroke="#D1D5DB"/>
<text x="288.0" y="62.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#0B1220" text-anchor="middle">prompts</text>
<text x="288.0" y="79.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="middle">where the trait matters</text>
<line x1="372" y1="67.0" x2="392" y2="67.0" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="392" y="40" width="168" height="54" rx="6" fill="#F0FAF5" stroke="#3F8F6B"/>
<text x="476.0" y="62.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#0B1220" text-anchor="middle">k replies</text>
<text x="476.0" y="79.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="middle">deployment prompt only</text>
<line x1="560" y1="67.0" x2="580" y2="67.0" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="580" y="40" width="168" height="54" rx="6" fill="#F0FAF5" stroke="#3F8F6B"/>
<text x="664.0" y="62.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#0B1220" text-anchor="middle">judge</text>
<text x="664.0" y="79.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="middle">alone sees the principle</text>
<line x1="748" y1="67.0" x2="768" y2="67.0" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="768" y="40" width="168" height="54" rx="6" fill="#F4F6F9" stroke="#D1D5DB"/>
<text x="852.0" y="62.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#0B1220" text-anchor="middle">markers</text>
<text x="852.0" y="79.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="middle">trait, on_task, no_filler</text>
<text x="16" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="400" fill="#B5602A" text-anchor="start">if the principle is in the sampling prompt you measure prompting, not character</text>
<path d="M 852.0 94 L 852.0 140" fill="none" stroke="#3F8F6B" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<rect x="560" y="142" width="184" height="44" rx="6" fill="#F4F6F9" stroke="#D1D5DB"/>
<text x="652.0" y="159.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#0B1220" text-anchor="middle">build_preference_pairs</text>
<text x="652.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="middle">length_match=True</text>
<rect x="760" y="142" width="184" height="44" rx="6" fill="#F4F6F9" stroke="#D1D5DB"/>
<text x="852.0" y="159.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#0B1220" text-anchor="middle">export_training</text>
<text x="852.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="middle">passes, loss mask on agent turn</text>
<line x1="652" y1="186" x2="652" y2="206" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="560" y="208" width="384" height="40" rx="6" fill="#F4F6F9" stroke="#D1D5DB"/>
<text x="752.0" y="223.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#0B1220" text-anchor="middle">train(method="dpo")  -&gt;  delta_report</text>
<text x="752.0" y="240.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="middle">target="marker:trait", must_not_regress=[on_task, no_filler]</text>
<text x="16" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#0B1220" text-anchor="start">judge check first:</text>
<text x="16" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">grade the spec's GOOD/BAD replies, judge_agreement &gt;= 0.8, kappa &gt;= 0.6</text>
<text x="16" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#0B1220" text-anchor="start">holdout:</text>
<text x="16" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">same prompts + "drop the act", plus plain tasks the persona must not distort</text>
</svg>
