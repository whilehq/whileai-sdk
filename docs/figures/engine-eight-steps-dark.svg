<text x="16" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#CBD5E1" text-anchor="start">pass@1 [lo..hi]  -&gt;  delta per task  -&gt;  ship when the interval excludes zero</text>
