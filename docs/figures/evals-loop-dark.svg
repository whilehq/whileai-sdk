<text x="860.0" y="79.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#9CA3AF" text-anchor="middle">exit 1 low, exit 2 hollow</text>
<text x="16" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="400" fill="#E09A6A" text-anchor="start">read scored.warnings first: no tool called, a tool never touched, a marker on no row</text>
