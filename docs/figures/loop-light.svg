<text x="592.0" y="169.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#0B1220" text-anchor="middle">Train and export</text>
<text x="592.0" y="185.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">rows.export, platform.train</text>
<path d="M 592.0 202 L 592.0 228 L 8 228 L 8 20 L 96.0 20 L 96.0 34" fill="none" stroke="#3F8F6B" stroke-width="1.5" marker-end="url(#arrow-green)" stroke-dasharray="4 3"/>
<text x="24" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="400" fill="#3F8F6B" text-anchor="start">serve it, then the new traces aim the next run: simulate(traces=)</text>
<text x="16" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">offline, no key: simulator=False, seeded_agent, a callable judge</text>
