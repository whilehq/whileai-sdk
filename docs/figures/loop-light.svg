<text x="128.0" y="185.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">scored.select(mode="rl")</text>
<path d="M 240 174.0 L 248 174.0" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
