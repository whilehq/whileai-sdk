<text x="272.0" y="59.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#0B1220" text-anchor="middle">Grade</text>
<text x="272.0" y="75.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">data.grade(judge=)</text>
<path d="M 352 64.0 L 368 64.0" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="368" y="36" width="160" height="56" rx="6" fill="#F4F6F9" stroke="#D1D5DB"/>
<text x="448.0" y="53.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#0B1220" text-anchor="middle">Validate the judge</text>
<text x="448.0" y="69.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">judge_trust</text>
<text x="448.0" y="83.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">judge_probes</text>
<path d="M 528 64.0 L 544 64.0" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="544" y="36" width="160" height="56" rx="6" fill="#F0FAF5" stroke="#3F8F6B"/>
<text x="624.0" y="59.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#0B1220" text-anchor="middle">Measure</text>
<text x="624.0" y="75.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">pass_at, delta_report</text>
