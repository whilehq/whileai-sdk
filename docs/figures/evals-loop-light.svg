<text x="412" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">agreement, kappa, Wilson lower bound;</text>
<text x="412" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">16 labels to clear 0.8 at perfect agreement</text>
<text x="16" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">check the judge before you read the number</text>
