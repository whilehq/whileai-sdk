<text x="116.0" y="55.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#E5E7EB" text-anchor="middle">constitution</text>
<text x="116.0" y="71.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9CA3AF" text-anchor="middle">one principle per trait</text>
<path d="M 216 60.0 L 248 60.0" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>
