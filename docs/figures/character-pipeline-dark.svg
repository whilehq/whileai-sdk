<text x="116.0" y="275.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#E5E7EB" text-anchor="middle">train(method="dpo")</text>
<text x="116.0" y="291.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9CA3AF" text-anchor="middle">or any DPO trainer</text>
<path d="M 216 280 L 248 280" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="248" y="252" width="456" height="56" rx="6" fill="#12261D" stroke="#5CB08A"/>
<text x="476.0" y="269.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#E5E7EB" text-anchor="middle">delta_report</text>
<text x="476.0" y="285.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9CA3AF" text-anchor="middle">target="marker:trait"</text>
<text x="476.0" y="299.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9CA3AF" text-anchor="middle">must_not_regress=[on_task, no_filler]</text>
<text x="16" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="400" fill="#9CA3AF" text-anchor="start">holdout: the same prompts + "drop the act", plus plain tasks the persona must not distort</text>
</svg>
