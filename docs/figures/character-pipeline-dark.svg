<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="Character training as a data pipeline: constitution, prompts, replies under the deployment prompt, a judge that alone sees the principle, pairs and SFT, then a paired delta">
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9CA3AF"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5CB08A"/></marker></defs>
<rect width="720" height="340" rx="6" fill="#0B1220"/>
