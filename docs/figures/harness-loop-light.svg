<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Harness optimization: traces split by day, the agent writes a candidate, the gate checks holdout, a second model and cost, the pick serves, the next day is scored">
