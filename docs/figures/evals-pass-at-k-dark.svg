<text x="610" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="400" fill="#CBD5E1" text-anchor="start">pass@4 - pass@1, what training can win</text>
