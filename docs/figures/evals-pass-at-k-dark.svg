<text x="16" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="400" fill="#9CA3AF" text-anchor="start">the interval is a bootstrap over tasks, not tries: five tasks is a wide one</text>
