<text x="16" y="24" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="600" fill="#3F8F6B" text-anchor="start">green: ours</text>
<text x="90" y="24" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="400" fill="#6B7280" text-anchor="start">the rest: from the literature</text>
<text x="16" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">01, 04, 05: the run.  02, 03: which situations.  06: reward.  07: training rows.  08: the proof.</text>
<path d="M 894.0 94 L 894.0 150 L 540.0 150 L 540.0 98" fill="none" stroke="#3F8F6B" stroke-width="1.5" marker-end="url(#arrow-green)" stroke-dasharray="4 3"/>
<text x="717.0" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="400" fill="#3F8F6B" text-anchor="middle">after training: re-run the held-out tasks</text>
<text x="16" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">pass@1 [lo..hi]  -&gt;  delta per task  -&gt;  ship when the interval excludes zero</text>
