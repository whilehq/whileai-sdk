<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250">
<rect x="0.5" y="0.5" width="719" height="249" rx="12" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="28" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="700" fill="#0B1220" text-anchor="start">Did training cost the model its range?</text>
