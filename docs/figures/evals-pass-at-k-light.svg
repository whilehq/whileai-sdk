<text x="400" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#3F8F6B" text-anchor="start">headroom</text>
<text x="484" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">pass@4 - pass@1: what training can win</text>
<text x="484" y="213" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">0.80 - 0.50 = 0.30</text>
<text x="16" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">the interval is a bootstrap over tasks, not tries; five tasks makes a wide one</text>
