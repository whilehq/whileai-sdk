<text x="484" y="113" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">1 / 5 = 0.20</text>
<text x="400" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#3F8F6B" text-anchor="start">pass@4</text>
