<text x="400" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#3F8F6B" text-anchor="start">pass@1</text>
<text x="484" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">mean of the per-task rates</text>
<text x="484" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">(1 + .75 + .5 + 0 + .25) / 5 = 0.50</text>
