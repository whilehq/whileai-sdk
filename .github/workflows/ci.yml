name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run pytest -q

  recipes:
    name: recipe smoke runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      # Every recipe that carries a smoke.sh runs it: the whole script, with no
      # key, no GPU and no spend. A recipe that trains on Modal cannot be run
      # here — a fork's PR gets no secrets, deliberately — so this is the part
      # a machine can check, and a maintainer runs the rest on our account.
      - name: run every recipes/**/smoke.sh
        run: |
          found=0
          for s in $(find recipes -name smoke.sh | sort); do
            found=1
            echo "::group::$s"
            uv run sh "$s"
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || { echo "no smoke.sh found under recipes/"; exit 1; }

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/check_no_hardcoding.py
      - run: uv run python scripts/check_old_name.py
      - run: uv run python scripts/check_cli_name.py

  ty:
    name: types (ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ty check

  coverage:
    name: line coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the README's coverage badge, published from main below
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # 3.12 for COVERAGE_CORE=sysmon. Under the default C tracer this
          # suite takes over half an hour; under sys.monitoring it costs
          # about 20s on top of an uninstrumented run. Do not drop the
          # pin or the env var without re-timing the job.
          python-version: "3.12"
      - run: uv sync --extra dev
      # The floor is the last measured coverage on main, rounded down, and
      # is raised whenever that number moves a whole point: 90.49% at
      # 882201c (19707 statements, 1874 missed). Raise it in the same PR
      # that raises coverage; never lower it to make a red job green.
      - run: uv run pytest -q --cov=whileai --cov-report=term --cov-report=json
              --cov-fail-under=90
        env:
          COVERAGE_CORE: sysmon
      # The README's coverage badge is the number this job just measured, not
      # a hand-typed floor. Published only from main, so a PR's coverage never
      # shows on the README. See .github/scripts/badge.py.
      - name: publish the coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pct=$(python3 -c "import json; t = json.load(open('coverage.json'))['totals']['percent_covered']; print('%.1f%%' % t)")
          python3 .github/scripts/badge.py coverage "$pct"

  build:
    name: build is installable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      # Installs the wheel with plain pip into a clean venv with no source tree
      # on the path. This is the check that would have caught the Prime
      # Intellect failure: a uv-only source pin passes local install and dies on
      # a pip-only runtime.
      - name: install wheel from a clean venv
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/whileai-*.whl
          cd /tmp && /tmp/fresh/bin/python -c "
          import whileai.simulations as wai
          from whileai.simulations.score.grading import conduct_grade
          from whileai.simulations.world.sandbox import MockEnvironment
          assert callable(wai.simulate)
          t = {'prompt': 'x', 'final_text': 'Fixed it, all tests pass.',
               'steps': [{'tool': 'run_tests', 'arguments': {},
                          'result': {'exit_code': 1, 'status': 'error'}}]}
          assert conduct_grade(t, {'run_tests'})['reward'] == 0.0
          print('wheel is self-contained')
          "

  version:
    name: version scheme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install packaging
      # Advisory on a PR: tells you now whether the version you picked will be
      # accepted by the publish gate after merge.
      - run: python .github/scripts/check_version.py
      # A bump lands through the release workflow (gh workflow run
      # release.yml), which leaves a fresh `## Unreleased` behind. A PR that
      # bumps by hand may touch only the three release files, and no PR may
      # drop the header the next cut renames.
      - name: release commits touch only release files
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          grep -qx '## Unreleased' CHANGELOG.md || {
            echo "CHANGELOG.md has no '## Unreleased' header; put it back above the newest version"
            exit 1
          }
          if git diff "$BASE"...HEAD -- pyproject.toml | grep -q '^+version = '; then
            extra=$(git diff --name-only "$BASE"...HEAD               | grep -vxE 'CHANGELOG.md|pyproject.toml|uv.lock' || true)
            if [ -n "$extra" ]; then
              echo "This PR bumps the version and also changes:"; echo "$extra"
              echo "Cut releases with: gh workflow run release.yml. Keep code changes in their own PR."
              exit 1
            fi
          fi
          echo ok
